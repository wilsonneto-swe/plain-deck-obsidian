name: Feature request
description: Something Plain Deck could do, with the problem it solves.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        To talk an idea through before it is concrete, open it in [Discussions](https://github.com/wilsonneto-swe/plain-deck-obsidian/discussions/categories/ideas) instead.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
      placeholder: When I study on my phone, ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you would like Plain Deck to handle it. A sketch of the deck or of the screen is welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What you use today
      description: A workaround, another plugin or another app that does this, and what you like or miss in it.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues and discussions for this idea.
          required: true

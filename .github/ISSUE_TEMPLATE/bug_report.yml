name: Bug report
description: Something in Plain Deck doesn't work as described in the README.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For questions and help, use [Discussions](https://github.com/wilsonneto-swe/plain-deck-obsidian/discussions) instead.
  - type: input
    id: plugin-version
    attributes:
      label: Plain Deck version
      description: Settings > Community plugins shows it.
      placeholder: "1.0.7"
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: Settings > General shows it.
      placeholder: "1.14.5"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Choose every platform where it happens.
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - iOS or iPadOS
        - Android
    validations:
      required: true
  - type: dropdown
    id: sync
    attributes:
      label: How the vault syncs
      multiple: true
      options:
        - Not synced
        - Obsidian Sync
        - iCloud
        - Git
        - Another service (Dropbox, Syncthing, OneDrive...)
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From opening Obsidian to the problem.
      placeholder: |
        1. Open the decks with the layers icon in the ribbon.
        2. Study "Example.cards.md".
        3. Rate the first card Good.
        4. ...
    validations:
      required: true
  - type: textarea
    id: sample-deck
    attributes:
      label: A deck that shows the problem
      description: |
        As small as you can make it. Replace anything personal with placeholder text. If the problem is about scheduling, keep the review lines (`<!-- srs: ... -->`): they hold only dates and numbers.
      render: markdown
      placeholder: |
        # Example

        ## A question?
        An answer.
    validations:
      required: false
  - type: textarea
    id: console
    attributes:
      label: Errors from the developer console
      description: "Desktop only: View > Toggle Developer Tools (Ctrl+Shift+I, or Cmd+Option+I on a Mac), then the Console tab. Paste any error that mentions plain-deck."
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: The sample deck and the steps contain no personal data.
          required: true
